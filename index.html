<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어린 왕자와 일곱 번째 별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#efe8d8;--paper:#fbf7ee;--ink:#2f3a2c;--muted:#6c7462;--line:#d8ceb6;--accent:#2d5d7b}
@media (prefers-color-scheme: dark){:root{--bg:#141b26;--paper:#1f2836;--ink:#ece6d6;--muted:#a3a99c;--line:#334156;--accent:#8cc0e0;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:"Gaegu","Gowun Dodum",cursive;font-size:2.2rem;line-height:1.1;margin:0}
p{margin:0;color:var(--muted)}
a.card{display:flex;flex-direction:column;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--accent);outline:none}
a.card b{font-family:"Gaegu","Gowun Dodum",cursive;font-size:1.5rem;line-height:1.2}
a.card span{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>어린 왕자와 일곱 번째 별</h1>
  <p>선생님이 알려 준 활동을 눌러 들어가세요.</p>
  <a class="card" href="pixel/"><span>4차시</span><b>숫자로 그리는 그림</b></a>
  <a class="card" href="baobab/"><span>5~6차시</span><b>바오밥 싹 감별 AI</b></a>
  <a class="card" href="sheep/"><span>7~8차시</span><b>입마개를 그려 줘</b></a>
  <a class="card" href="lamp/"><span>10~11차시</span><b>저절로 켜지는 가로등</b></a>
  <a class="card" href="hire/"><span>20차시</span><b>편견을 배우는 AI 면접관</b></a>
</div>
</body>
</html>
